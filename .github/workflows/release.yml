# Release builder for xinquiry/koda-releases.
#
# This workflow lives in the PUBLIC koda-releases repo on purpose: Actions on
# public repositories are free and unmetered, so the expensive build matrix
# (including 10x-cost macOS runners) runs at zero Actions-minutes cost. The
# private source repo (xinquiry/koda) no longer builds releases itself.
#
# Layout:
#   * xinquiry/koda          — private source; `just release` tags and pushes
#                              there, then fires the dispatch below.
#   * xinquiry/koda-releases — public; hosts this workflow, the release
#                              artifacts, and the Homebrew-installed binaries.
#   * xinquiry/homebrew-tap  — public; receives formula commits.
#
# How a release runs:
#   1. `just release X` in the private repo pushes tag vX and calls
#      `gh api ... /dispatches` (event `dist-release`, payload carries the tag).
#   2. This workflow checks out the PRIVATE source at that tag using
#      KODA_SOURCE_TOKEN (read-only PAT on xinquiry/koda) — see
#      "Checkout private source" steps. The public repo itself contains no
#      source, so every job must check out the private repo, not this one.
#   3. The standard cargo-dist pipeline runs unchanged (plan → build-local →
#      build-global → host → publish-homebrew), publishing the GitHub Release
#      to THIS repo with its own GITHUB_TOKEN, and formulas to the tap with
#      HOMEBREW_TAP_TOKEN.
#
# Log redaction: public build logs must not leak private source. Every
# compile-heavy step writes its full output to a log file and prints only a
# success line; on failure it prints the exit code and a coarse summary, and
# uploads the full log as a build-log-* artifact. GitHub log output on public
# repos is world-readable; artifacts on public repos are also downloadable by
# anyone, so failure logs additionally run through a source-path scrubber
# before upload (redact step strips file:line references). If you need the
# pristine failing log, re-run locally with `just release` semantics or check
# out the tag and run `dist build` yourself.
#
# Manual fallback: workflow_dispatch below allows kicking a specific tag by
# hand from the Actions tab (use if `gh` is unavailable or a dispatch failed).
#
# This file was originally autogenerated by cargo-dist and then manually
# migrated from the private repo. If you re-run `dist generate` there, do NOT
# copy the generated file over this one; diff it for pipeline changes only.

name: Release
permissions:
  "contents": "write"

on:
  repository_dispatch:
    types: [dist-release]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v0.1.24)"
        required: true
        type: string

# One release at a time; a stray duplicate dispatch cancels the older run
# instead of burning a second full matrix.
concurrency:
  group: release-${{ github.event.client_payload.tag || inputs.tag }}
  cancel-in-progress: true

env:
  # The private source repo every job checks out.
  KODA_SOURCE_REPO: xinquiry/koda
  # The tag being released, normalized across both trigger types.
  KODA_RELEASE_TAG: ${{ github.event.client_payload.tag || inputs.tag }}

jobs:
  # Run 'dist plan' (or host) to determine what tasks we need to do
  plan:
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ env.KODA_RELEASE_TAG }}
      tag-flag: ${{ format('--tag={0}', env.KODA_RELEASE_TAG) }}
      publishing: "true"
    env:
      # dist host --steps=create probes the release target (this repo);
      # GITHUB_TOKEN on this repo has contents:write.
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout private source
        uses: actions/checkout@v6
        with:
          repository: ${{ env.KODA_SOURCE_REPO }}
          ref: ${{ env.KODA_RELEASE_TAG }}
          token: ${{ secrets.KODA_SOURCE_TOKEN }}
          persist-credentials: false
          submodules: recursive
      - name: Install dist
        # we specify bash to get pipefail; it guards against the `curl` command
        # failing. otherwise `sh` won't catch that `curl` returned non-0
        shell: bash
        run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh"
      - name: Cache dist
        uses: actions/upload-artifact@v7
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist
      - id: plan
        shell: bash
        run: |
          set -o pipefail
          dist host --steps=create --tag="$KODA_RELEASE_TAG" --output-format=json > plan-dist-manifest.json 2> plan.log
          echo "dist plan ran successfully"
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  # Build and packages all the platform-specific things
  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    # Let the initial task tell us to not run (currently very blunt)
    needs:
      - plan
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null }}
    strategy:
      fail-fast: false
      # Target platforms/runners are computed by dist in create-release.
      # Each member of the matrix has the following arguments:
      #
      # - runner: the github runner
      # - dist-args: cli flags to pass to dist
      # - install-dist: expression to run to install dist on the runner
      #
      # Typically there will be:
      # - 1 "global" task that builds universal installers
      # - N "local" tasks that build each platform's binaries and platform-specific installers
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - name: enable windows longpaths
        run: |
          git config --global core.longpaths true
      - name: Checkout private source
        uses: actions/checkout@v6
        with:
          repository: ${{ env.KODA_SOURCE_REPO }}
          ref: ${{ needs.plan.outputs.tag }}
          token: ${{ secrets.KODA_SOURCE_TOKEN }}
          persist-credentials: false
          submodules: recursive
      - name: Install Rust non-interactively if not already installed
        if: ${{ matrix.container }}
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi
      - name: Install dist
        run: ${{ matrix.install_dist.run }}
      # Get the dist-manifest
      - name: Fetch local artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Install dependencies
        run: |
          ${{ matrix.packages_install }}
      - name: Build artifacts
        shell: bash
        run: |
          # Full output goes to a log file; the public log only sees success
          # or a redacted failure summary (see header comment).
          set +e
          dist build ${{ needs.plan.outputs.tag-flag }} --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json 2> build.log
          status=$?
          if [ $status -ne 0 ]; then
            echo "dist build FAILED (exit $status) — redacted tail of the log:"
            tail -n 40 build.log | sed -E 's#(\.\./|\./)?(crates|src|tests)/[^ :]*#\1<private-source-path>#g'
            echo "::error::dist build failed with exit code $status (full log in run artifacts)"
            exit $status
          fi
          echo "dist ran successfully"
      - id: cargo-dist
        name: Post-build
        # We force bash here just because github makes it really hard to get values up
        # to "real" actions without writing to env-vars, and writing to env-vars has
        # inconsistent syntax between shell and powershell.
        shell: bash
        run: |
          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          dist print-upload-files-from-manifest --manifest dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload build log"
        # Attach the redacted build log even on success — linkage output is
        # useful for debugging and already path-scrubbed.
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: build-log-${{ join(matrix.targets, '_') }}
          path: build.log
      - name: "Upload artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # Build and package all the platform-agnostic(ish) things
  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - name: Checkout private source
        uses: actions/checkout@v6
        with:
          repository: ${{ env.KODA_SOURCE_REPO }}
          ref: ${{ needs.plan.outputs.tag }}
          token: ${{ secrets.KODA_SOURCE_TOKEN }}
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@v8
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Get all the local artifacts for the global tasks to use (for e.g. checksums)
      - name: Fetch local artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        shell: bash
        run: |
          set -o pipefail
          dist build ${{ needs.plan.outputs.tag-flag }} --output-format=json "--artifacts=global" > dist-manifest.json 2> build.log
          echo "dist ran successfully"

          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          jq --raw-output ".upload_files[]" dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}
  # Determines if we should publish/announce
  host:
    needs:
      - plan
      - build-local-artifacts
      - build-global-artifacts
    # Only run if plan, local and global didn't fail (skipped is fine)
    if: ${{ always() && needs.plan.result == 'success' && (needs.build-global-artifacts.result == 'skipped' || needs.build-global-artifacts.result == 'success') && (needs.build-local-artifacts.result == 'skipped' || needs.build-local-artifacts.result == 'success') }}
    env:
      # Release creation targets this repo, so the workflow's own token works.
      GH_TOKEN: ${{ github.token }}
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    steps:
      - name: Checkout private source
        uses: actions/checkout@v6
        with:
          repository: ${{ env.KODA_SOURCE_REPO }}
          ref: ${{ needs.plan.outputs.tag }}
          token: ${{ secrets.KODA_SOURCE_TOKEN }}
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@v8
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Fetch artifacts from scratch-storage
      - name: Fetch artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: host
        shell: bash
        run: |
          set -o pipefail
          dist host ${{ needs.plan.outputs.tag-flag }} --steps=upload --steps=release --output-format=json > dist-manifest.json 2> host.log
          echo "artifacts uploaded and released successfully"
          cat dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@v7
        with:
          # Overwrite the previous copy
          name: artifacts-dist-manifest
          path: dist-manifest.json
      # Create a GitHub Release while uploading all files to it
      - name: "Download GitHub Artifacts"
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Cleanup
        run: |
          # Remove the granular manifests
          rm -f artifacts/*-dist-manifest.json
      - name: Create GitHub Release
        env:
          PRERELEASE_FLAG: "${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease && '--prerelease' || '' }}"
          ANNOUNCEMENT_TITLE: "${{ fromJson(steps.host.outputs.manifest).announcement_title }}"
          ANNOUNCEMENT_BODY: "${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}"
        run: |
          # Write and read notes from a file to avoid quoting breaking things
          echo "$ANNOUNCEMENT_BODY" > $RUNNER_TEMP/notes.txt

          # `gh` infers the target repo from the git remote of the checked-out
          # workspace — which is the PRIVATE xinquiry/koda — so it must be
          # pointed at this repo explicitly. (Missing this was the first run's
          # failure: HTTP 404 on api.github.com/repos/xinquiry/koda/releases.)
          # The tag is created on this repo's default branch (the private
          # repo's SHA does not exist here).
          gh release create "${{ needs.plan.outputs.tag }}" --repo xinquiry/koda-releases --target main $PRERELEASE_FLAG --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt" artifacts/*

  publish-homebrew-formula:
    needs:
      - plan
      - host
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ github.token }}
      PLAN: ${{ needs.plan.outputs.val }}
      GITHUB_USER: "axo bot"
      GITHUB_EMAIL: "admin+bot@axo.dev"
    if: ${{ !fromJson(needs.plan.outputs.val).announcement_is_prerelease || fromJson(needs.plan.outputs.val).publish_prereleases }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
          repository: "xinquiry/homebrew-tap"
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      # So we have access to the formula
      - name: Fetch homebrew formulae
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: Formula/
          merge-multiple: true
      # This is extra complex because you can make your Formula name not match your app name
      # so we need to find releases with a *.rb file, and publish with that filename.
      - name: Commit formula files
        run: |
          git config --global user.name "${GITHUB_USER}"
          git config --global user.email "${GITHUB_EMAIL}"

          for release in $(echo "$PLAN" | jq --compact-output '.releases[] | select([.artifacts[] | endswith(".rb")] | any)'); do
            filename=$(echo "$release" | jq '.artifacts[] | select(endswith(".rb"))' --raw-output)
            name=$(echo "$filename" | sed "s/\.rb$//")
            version=$(echo "$release" | jq .app_version --raw-output)

            export PATH="/home/linuxbrew/.linuxbrew/bin:$PATH"
            brew update
            # We avoid reformatting user-provided data such as the app description and homepage.
            brew style --except-cops FormulaAudit/Homepage,FormulaAudit/Desc,FormulaAuditStrict --fix "Formula/${filename}" || true

            git add "Formula/${filename}"
            git commit -m "${name} ${version}"
          done
          git push

  announce:
    needs:
      - plan
      - host
      - publish-homebrew-formula
    # use "always() && ..." to allow us to wait for all publish jobs while
    # still allowing individual publish jobs to skip themselves (for prereleases).
    # "host" however must run to completion, no skipping allowed!
    if: ${{ always() && needs.host.result == 'success' && (needs.publish-homebrew-formula.result == 'skipped' || needs.publish-homebrew-formula.result == 'success') }}
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout private source
        uses: actions/checkout@v6
        with:
          repository: ${{ env.KODA_SOURCE_REPO }}
          ref: ${{ needs.plan.outputs.tag }}
          token: ${{ secrets.KODA_SOURCE_TOKEN }}
          persist-credentials: false
          submodules: recursive
